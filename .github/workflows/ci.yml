name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Check that dist/ matches the source
        run: |
          npm run package
          git diff --exit-code --stat -- dist/ || { echo "dist/ is stale: run 'npm run package' and commit dist/"; exit 1; }
